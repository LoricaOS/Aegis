name: build

# Builds the Aegis kernel for both architectures, runs the boot + capability
# test suite under QEMU, and — on a version tag — publishes the kernel ELFs to
# the GitHub release so downstream (LoricaOS tools/fetch-kernel.sh) can pin them.
#
# Toolchain: no bare-metal cross toolchain needed. x86-64 builds freestanding
# with the stock distro gcc; AArch64 with apt's gcc-aarch64-linux-gnu. The
# Kconfig config (.config -> auto.conf + autoconf.h) is normally generated by
# `kconf` from the PRIVATE LoricaOS/kconfig repo — unavailable in CI — so we use
# the public, pip-installable `kconfiglib`, which emits a byte-for-byte
# equivalent CONFIG_ set (verified) for the full_defconfig everything-on build.

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  # ── x86-64: build + full boot/capability test suite ─────────────────────
  x86:
    # Pinned, not `ubuntu-latest`: the label rolled 24.04 -> 26.04 between runs and
    # silently broke the boot test for a commit that had already passed (the same
    # v1.6.0 tree boots on 24.04 and dies right after [CMDLINE] on 26.04). The
    # kernel's early bring-up is sensitive to the QEMU/firmware it lands on, so
    # move this label deliberately, with a boot test to match — not by a label
    # that re-points itself.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Cache the pinned Limine clone
        # tools/fetch-limine.sh clones the pinned Limine release into vendor/
        # (~4 MB) on first use and copies the files it needs out of it. The
        # clone is skipped when this cache is warm, which also takes a network
        # dependency out of every run.
        uses: actions/cache@v4
        with:
          path: vendor
          key: limine-${{ hashFiles('tools/limine/VERSION') }}
      - name: Install toolchain
        # gcc-14 specifically: the kernel is -Werror-clean under the canonical
        # x86_64-elf-gcc and gcc-14, but ubuntu's default gcc-13 promotes an
        # -Waddress-of-packed-member in a driver to an error. Match the validated
        # compiler rather than relax the warning set.
        #
        # Cached with the standard apt cache action: the install was ~37s of a
        # ~156s job, nearly all of it download. Bump `version` to rotate the
        # cache (e.g. when the package set or runner baseline changes).
        uses: awalsh128/cache-apt-pkgs-action@v1.6.3
        with:
          packages: build-essential gcc-14 nasm binutils xorriso e2fsprogs mtools qemu-system-x86 curl python3-venv
          version: 1.0
      - name: Generate kernel config (kconfiglib — public kconf replacement)
        run: |
          python3 -m venv /tmp/kcvenv
          /tmp/kcvenv/bin/pip install --quiet kconfiglib
          mkdir -p build/generated
          /tmp/kcvenv/bin/python - <<'PY'
          import kconfiglib
          kc = kconfiglib.Kconfig("Kconfig", warn_to_stderr=False)
          kc.load_config("configs/full_defconfig")
          kc.write_config(".config")
          kc.write_config("build/auto.conf")          # CONFIG_*=y make vars
          kc.write_autoconf("build/generated/autoconf.h")
          PY
          touch .config build/auto.conf build/generated/autoconf.h
      - name: Build kernel (x86-64, stock gcc, freestanding)
        run: make CC=gcc-14 LD=ld OBJCOPY=objcopy NM=nm -j"$(nproc)"
      - name: Record the boot-test environment
        # A boot test that dies in early bring-up reports almost nothing on its
        # own. Print the facts that caused the last silent failure — the runner
        # image and the QEMU build — so the next drift is readable straight from
        # the log instead of a multi-day bisect.
        run: |
          echo "runner image : ${ImageOS:-unknown}"
          qemu-system-x86_64 --version | head -1
          gcc-14 --version | head -1
          echo "kvm available: $([ -e /dev/kvm ] && echo yes || echo no)"
      - name: Boot + capability tests (captest + ktest under QEMU/TCG)
        run: make CC=gcc-14 LD=ld OBJCOPY=objcopy NM=nm test
      - name: Stage release artifact
        # The release asset is the STRIPPED image: that is what `make dist`
        # documents, and LoricaOS embeds the fetched file in a 3 MiB ESP slot
        # (build/aegis.elf is ~5x larger and overflows it once the kernel grows).
        run: cp build/aegis-stripped.elf aegis.elf
      - uses: actions/upload-artifact@v4
        with:
          name: aegis-x86
          path: aegis.elf
          if-no-files-found: error

  # ── AArch64: build (cross toolchain from apt) ───────────────────────────
  arm64:
    # Pinned for the same reason as the x86 job.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Cache the pinned Limine clone
        # Same cache as the x86 job — the Limine release carries both the BIOS
        # and the AArch64 UEFI blobs.
        uses: actions/cache@v4
        with:
          path: vendor
          key: limine-${{ hashFiles('tools/limine/VERSION') }}
      - name: Install aarch64 cross toolchain
        # Cached for the same reason as x86: this install was ~26s of download.
        uses: awalsh128/cache-apt-pkgs-action@v1.6.3
        with:
          packages: gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu build-essential nasm curl python3-venv e2fsprogs xorriso qemu-system-arm qemu-efi-aarch64
          version: 1.0
      - name: Generate kernel config (kconfiglib)
        run: |
          python3 -m venv /tmp/kcvenv
          /tmp/kcvenv/bin/pip install --quiet kconfiglib
          mkdir -p build/generated
          /tmp/kcvenv/bin/python - <<'PY'
          import kconfiglib
          kc = kconfiglib.Kconfig("Kconfig", warn_to_stderr=False)
          kc.load_config("configs/full_defconfig")
          kc.write_config(".config")
          kc.write_config("build/auto.conf")
          kc.write_autoconf("build/generated/autoconf.h")
          PY
          touch .config build/auto.conf build/generated/autoconf.h
      - name: Build kernel (AArch64)
        run: make -f Makefile.arm64 -j"$(nproc)"
      - name: Record the boot-test environment
        # Same reason as the x86 job.
        run: |
          echo "runner image : ${ImageOS:-unknown}"
          qemu-system-aarch64 --version | head -1
          aarch64-linux-gnu-gcc --version | head -1
      - name: Boot + capability tests (captest + ktest under QEMU/TCG)
        run: make -f Makefile.arm64 test
      - name: Stage release artifact
        # Stripped, for the same reason as x86: the asset is embedded in a
        # fixed-size ESP slot by LoricaOS.
        run: cp build/arm64/aegis-arm64-stripped.elf aegis-arm64.elf
      - uses: actions/upload-artifact@v4
        with:
          name: aegis-arm64
          path: aegis-arm64.elf
          if-no-files-found: error

  # ── On a version tag: attach both kernels to the release ────────────────
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [x86, arm64]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: aegis-x86
      - uses: actions/download-artifact@v4
        with:
          name: aegis-arm64
      - name: Publish kernels to the release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            aegis.elf
            aegis-arm64.elf
          fail_on_unmatched_files: true
